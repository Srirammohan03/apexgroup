<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apex Group — Powering a World in Motion</title>
    <meta
      name="description"
      content="Immersive 3D corporate experience uniting Apex Road Lines, Apex Bio Fuel India, Pranar Oils & Chemicals, Apex Natural Lubes & Chemicals FZCO, and JS Fuels."
    />
    <meta property="og:title" content="Apex Group — Powering a World in Motion" />
    <meta
      property="og:description"
      content="Five Businesses. One Vision. A Connected Energy Ecosystem."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('apex-theme');
          if (saved === 'day') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-[#F28C28] selection:text-[#0B0D10]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
